name: CI / PR Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check docs links
        run: python3 scripts/docs/check-doc-links.py

      - name: Grade golden skill evals
        run: |
          python3 evals/skill-workflows/skill_eval.py \
            --workspace evals/skill-workflows/golden/iteration-1 \
            --configs with_skill \
            --grade

      - name: Check plugin skill manifests
        run: |
          test -f plugins/mdmind/skills/mdmind-map-authoring/SKILL.md
          test -f plugins/mdmind/skills/mdm-cli-inspection/SKILL.md

  build-matrix:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets
